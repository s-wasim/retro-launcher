plugins { id 'com.android.application' }

android {
    namespace 'com.retro.launcher'
    compileSdk 36

    defaultConfig {
        applicationId "com.retro.launcher"
        // Stays at 26. Nothing here needs a higher floor, and raising it
        // drops devices for nothing.
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1"
        vectorDrawables.useSupportLibrary false
    }

    // resConfigs moved out of defaultConfig and was deprecated in AGP 8.x.
    androidResources {
        localeFilters += ['en']
    }

    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
}
