name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Pinned with the AGP version in build.gradle: AGP 8.13.2 needs
          # Gradle 8.14 or newer. There is no wrapper in this repo, so the
          # two have to be changed together.
          gradle-version: '8.14.5'

      # packages: the action's default is "tools platform-tools", and `tools`
      # — the obsolete SDK Tools package, superseded by cmdline-tools years
      # ago — was removed from Google's repository. Once the runner image
      # moved to cmdline-tools 16.0 the default started failing every build
      # on every branch with "Failed to find package 'tools'", before Gradle
      # ran at all. Naming the one package we actually want drops the dead
      # one. Nothing in this repo ever used `tools`.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # Everything the build needs, named explicitly rather than inherited
      # from whatever the runner image happens to preinstall. android-36 was
      # coming from the image before; that is the same class of assumption
      # that `tools` turned out to be, and sdkmanager is a no-op when a
      # package is already present.
      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests
        run: gradle :core:test --no-daemon

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Verify signer
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          FINGERPRINT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | grep 'Signer #1 certificate SHA-256 digest' | awk '{print $NF}' | tr 'a-f' 'A-F' \
            | sed 's/\(..\)/\1:/g; s/:$//')
          EXPECTED=$(cat app/expected-signer.txt | tr -d '\n')
          echo "Built with signer:    $FINGERPRINT"
          echo "Expected signer:      $EXPECTED"
          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "::error::Signer fingerprint mismatch — this build would break updates for every installed copy."
            exit 1
          fi

      - name: Report APK size
        run: ls -lh app/build/outputs/apk/debug/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Automated build from ${{ github.sha }}. Signer: $(cat app/expected-signer.txt). versionCode: $((${{ github.run_number }} + 1000))."
