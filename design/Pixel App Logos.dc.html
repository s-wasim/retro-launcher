<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  a { color: inherit; }
  a:hover { color: inherit; }
</style>
</helmet>
<div style="{{ pageStyle }}">
  <div style="max-width: 1180px; margin: 0 auto; padding: 56px 40px 80px">

    <div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-end; justify-content: space-between; margin-bottom: 14px">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div style="font-family: 'Press Start 2P', monospace; font-size: 22px; line-height: 1.5; letter-spacing: 1px">PIXEL APP LOGOS</div>
        <div style="font-family: 'Press Start 2P', monospace; font-size: 8px; line-height: 2.2; opacity: 0.7">51 MARKS &middot; 16x16 GRID &middot; 6 COLORS &middot; CLICK ANY TILE TO COPY SVG</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; align-items: flex-start">
        <div style="font-family: 'Press Start 2P', monospace; font-size: 7px; opacity: 0.55; letter-spacing: 1px">PALETTE</div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <sc-for list="{{ palButtons }}" as="btn" hint-placeholder-count="3">
            <button onClick="{{ btn.onClick }}" style="{{ btn.style }}">{{ btn.label }}</button>
          </sc-for>
        </div>
        <div style="font-family: 'Press Start 2P', monospace; font-size: 7px; opacity: 0.55; letter-spacing: 1px; margin-top: 6px">THEME</div>
        <div style="display: flex; gap: 8px">
          <sc-for list="{{ themeButtons }}" as="btn" hint-placeholder-count="2">
            <button onClick="{{ btn.onClick }}" style="{{ btn.style }}">{{ btn.label }}</button>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="{{ swatchRowStyle }}">
      <sc-for list="{{ palRows }}" as="row" hint-placeholder-count="3">
        <div style="{{ row.rowStyle }}">
          <div style="{{ row.nameStyle }}">{{ row.name }}</div>
          <div style="display: grid; grid-template-columns: repeat(6, minmax(84px, 1fr)); gap: 10px; flex: 1">
            <sc-for list="{{ row.swatches }}" as="sw" hint-placeholder-count="6">
              <div style="display: flex; align-items: center; gap: 8px">
                <div style="{{ sw.chipStyle }}"></div>
                <div style="display: flex; flex-direction: column; gap: 4px">
                  <div style="font-family: 'Press Start 2P', monospace; font-size: 6px; letter-spacing: 0.5px; opacity: 0.6">{{ sw.label }}</div>
                  <div style="font-family: 'Press Start 2P', monospace; font-size: 7px; letter-spacing: 0.5px">{{ sw.hex }}</div>
                </div>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>

    <sc-for list="{{ groups }}" as="group" hint-placeholder-count="5">
      <div style="margin-top: 46px">
        <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 22px">
          <div style="font-family: 'Press Start 2P', monospace; font-size: 10px; letter-spacing: 2px">{{ group.title }}</div>
          <div style="{{ ruleStyle }}"></div>
          <div style="font-family: 'Press Start 2P', monospace; font-size: 7px; opacity: 0.5">{{ group.count }}</div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 26px 18px">
          <sc-for list="{{ group.icons }}" as="icon" hint-placeholder-count="8">
            <div onClick="{{ icon.onCopy }}" title="Click to copy SVG" style="display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer">
              <div style="{{ icon.frameStyle }}">{{ icon.svg }}</div>
              <div style="{{ icon.labelStyle }}">{{ icon.label }}</div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>

  </div>
  <div style="{{ toastStyle }}">{{ toastText }}</div>
</div>
</x-dc>

const TILE_SPAN = [[3,12],[2,13],[1,14],[0,15],[0,15],[0,15],[0,15],[0,15],[0,15],[0,15],[0,15],[0,15],[0,15],[1,14],[2,13],[3,12]];

class Component extends DCLogic {
  state = { pal: null, theme: null, toast: '' };

  compose(rows) {
    const grid = [];
    for (let y = 0; y < 16; y++) grid.push(new Array(16).fill('.'));
    for (let y = 0; y < 16; y++) {
      const sp = TILE_SPAN[y];
      for (let x = sp[0]; x <= sp[1]; x++) grid[y][x] = 't';
    }
    for (let gy = 0; gy < 12; gy++) {
      const row = (rows[gy] || '').padEnd(12, '.');
      for (let gx = 0; gx < 12; gx++) {
        const c = row[gx];
        if (c && c !== '.' && c !== ' ') grid[gy + 2][gx + 2] = c;
      }
    }
    const runs = [];
    for (let y = 0; y < 16; y++) {
      let x = 0;
      while (x < 16) {
        const c = grid[y][x];
        if (c === '.') { x++; continue; }
        let w = 1;
        while (x + w < 16 && grid[y][x + w] === c) w++;
        runs.push({ x: x, y: y, w: w, c: c });
        x += w;
      }
    }
    return runs;
  }

  svgString(runs, C) {
    const map = { t: C.tile, p: C.p, a: C.a, s: C.s, h: C.h };
    let out = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="256" height="256" shape-rendering="crispEdges">';
    runs.forEach(function (r) {
      out += '<rect x="' + r.x + '" y="' + r.y + '" width="' + r.w + '" height="1" fill="' + map[r.c] + '"/>';
    });
    return out + '</svg>';
  }

  copy(name, runs, C) {
    const self = this;
    const txt = this.svgString(runs, C);
    try {
      navigator.clipboard.writeText(txt);
      this.setState({ toast: name + ' SVG COPIED' });
    } catch (e) {
      this.setState({ toast: 'COPY BLOCKED — SELECT MANUALLY' });
    }
    clearTimeout(this._t);
    this._t = setTimeout(function () { self.setState({ toast: '' }); }, 1800);
  }

  renderVals() {
    const self = this;
    const palId = this.state.pal || this.props.palette || 'gb';
    const theme = this.state.theme || this.props.theme || 'light';
    const pal = PALETTES.filter(function (p) { return p.id === palId; })[0] || PALETTES[0];
    const C = pal[theme === 'dark' ? 'dark' : 'light'];
    const size = this.props.iconSize || 88;
    const showLabels = this.props.showLabels !== false;

    const btn = function (active) {
      return {
        fontFamily: "'Press Start 2P', monospace", fontSize: '8px', letterSpacing: '1px',
        padding: '10px 12px', cursor: 'pointer', border: '2px solid ' + C.p,
        background: active ? C.p : 'transparent', color: active ? C.tile : C.ink,
        borderRadius: '0px', lineHeight: 1
      };
    };

    const palButtons = PALETTES.map(function (p) {
      return { label: p.label, style: btn(p.id === palId), onClick: function () { self.setState({ pal: p.id }); } };
    });
    const themeButtons = [['light', 'LIGHT'], ['dark', 'DARK']].map(function (t) {
      return { label: t[1], style: btn(t[0] === theme), onClick: function () { self.setState({ theme: t[0] }); } };
    });

    const palRows = PALETTES.map(function (p) {
      const K = p[theme === 'dark' ? 'dark' : 'light'];
      const active = p.id === palId;
      return {
        name: p.label,
        rowStyle: {
          display: 'flex', gap: '18px', alignItems: 'center', padding: '12px 14px',
          border: '2px solid ' + C.p, opacity: active ? 1 : 0.5,
          background: active ? C.p + '18' : 'transparent'
        },
        nameStyle: {
          fontFamily: "'Press Start 2P', monospace", fontSize: '7px', letterSpacing: '1px',
          width: '86px', lineHeight: 1.6
        },
        swatches: [['PRIMARY', K.p], ['ACCENT', K.a], ['SHADE', K.s], ['HIGHLIGHT', K.h], ['TILE', K.tile], ['BACKDROP', K.bg]].map(function (s) {
          return {
            label: s[0], hex: s[1].toUpperCase(),
            chipStyle: { width: '22px', height: '22px', flex: '0 0 22px', background: s[1], border: '2px solid ' + C.p }
          };
        })
      };
    });

    const groups = GROUPS.map(function (g) {
      return {
        title: g.title,
        count: g.items.length + ' MARKS',
        icons: g.items.map(function (it) {
          const rows = G[it[0]] || [];
          const runs = self.compose(rows);
          return {
            label: it[1],
            frameStyle: { width: size + 'px', height: size + 'px', lineHeight: 0 },
            labelStyle: {
              fontFamily: "'Press Start 2P', monospace", fontSize: '7px', letterSpacing: '0.5px',
              color: C.ink, textAlign: 'center', opacity: showLabels ? 0.85 : 0, lineHeight: 1.4
            },
            svg: React.createElement('svg', {
              viewBox: '0 0 16 16', width: '100%', height: '100%',
              style: { display: 'block', shapeRendering: 'crispEdges' }
            }, runs.map(function (r, i) {
              const map = { t: C.tile, p: C.p, a: C.a, s: C.s, h: C.h };
              return React.createElement('rect', { key: i, x: r.x, y: r.y, width: r.w, height: 1, fill: map[r.c] });
            })),
            onCopy: function () { self.copy(it[1], runs, C); }
          };
        })
      };
    });

    return {
      groups: groups, palButtons: palButtons, themeButtons: themeButtons, palRows: palRows,
      pageStyle: { background: C.bg, color: C.ink, minHeight: '100vh', position: 'relative', transition: 'background 160ms linear' },
      ruleStyle: { flex: 1, height: '2px', background: C.p, opacity: 0.45 },
      swatchRowStyle: { display: 'flex', flexDirection: 'column', gap: '10px', marginTop: 22 },
      toastText: this.state.toast,
      toastStyle: {
        position: 'fixed', bottom: '26px', left: '50%', transform: 'translateX(-50%)',
        fontFamily: "'Press Start 2P', monospace", fontSize: '8px', letterSpacing: '1px',
        padding: '12px 16px', background: C.p, color: C.tile,
        opacity: this.state.toast ? 1 : 0, pointerEvents: 'none', transition: 'opacity 140ms linear'
      }
    };
  }
}
</script>
</body>
</html>
